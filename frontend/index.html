<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stadium Security Dashboard</title>

  <!--
    STUB-BASED GENERATION NOTE:
    The comments inside this file describe what each UI piece is for.
    app.js (the <script> at the bottom) contains ALL the fetch and render
    logic — the stylesheet and HTML here just lay out the dashboard.
  -->

  <style>
    :root {
      --bg:          #0f172a;
      --panel:       #1e293b;
      --border:      #334155;
      --text:        #e2e8f0;
      --muted:       #94a3b8;
      --green:       #34d399;
      --blue:        #60a5fa;
      --accent:      #3b82f6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 24px;
    }

    /* ── Header ──────────────────────────────────────────────── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    header h1 {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* Status badge — shows connection state, updated by app.js */
    #status-badge {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 20px;
      border: 1px solid var(--border);
      color: var(--muted);
    }

    #status-badge.connected {
      color: var(--green);
      border-color: var(--green);
      background: rgba(52, 211, 153, 0.1);
    }

    /* ── Controls bar ───────────────────────────────────────── */
    .controls {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .controls label {
      font-size: 0.78rem;
      color: var(--muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /*
      GATE FILTER — the dropdown whose change event calls
      fetchEntries(this.value) in app.js.
    */
    #gate-filter {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: 7px 12px;
      font-size: 0.85rem;
      cursor: pointer;
      outline: none;
    }

    #gate-filter:focus { border-color: var(--blue); }

    /*
      REFRESH BUTTON — onClick calls fetchEntries() with the current
      filter value, wired up in app.js.
    */
    #refresh-btn {
      padding: 7px 16px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }

    #refresh-btn:hover { background: #2563eb; }

    /* Entry count — number of rows shown, updated by app.js */
    #entry-count {
      margin-left: auto;
      font-size: 0.78rem;
      color: var(--muted);
    }

    #entry-count span {
      font-weight: 700;
      color: var(--blue);
    }

    /* ── Table ──────────────────────────────────────────────── */
    .table-wrap {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
    }

    thead th {
      padding: 10px 14px;
      text-align: left;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--muted);
      background: rgba(0, 0, 0, 0.2);
      border-bottom: 1px solid var(--border);
    }

    tbody td {
      padding: 10px 14px;
      border-bottom: 1px solid rgba(51, 65, 85, 0.5);
      color: var(--text);
    }

    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover td { background: rgba(255, 255, 255, 0.03); }

    /* Gate colour badges, one class per gate */
    .gate-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: 700;
    }

    .gate-A { background: rgba(96, 165, 250, 0.15);   color: #60a5fa; }
    .gate-B { background: rgba(167, 139, 250, 0.15);  color: #a78bfa; }
    .gate-C { background: rgba(52, 211, 153, 0.15);   color: #34d399; }
    .gate-D { background: rgba(251, 191, 36, 0.15);   color: #fbbf24; }

    /* ── Empty / loading state ─────────────────────────────── */
    #empty-state {
      padding: 48px;
      text-align: center;
      color: var(--muted);
      font-size: 0.88rem;
    }
  </style>
</head>
<body>

  <!-- ── HEADER ── -->
  <header>
    <h1>🏟 Stadium Security Dashboard</h1>
    <!-- Updated by app.js once the backend responds -->
    <div id="status-badge">Waiting for backend…</div>
  </header>

  <!-- ── CONTROLS ── -->
  <div class="controls">
    <label for="gate-filter">Filter by gate</label>

    <!-- GATE FILTER DROPDOWN: app.js listens for its change event -->
    <select id="gate-filter">
      <option value="">All Gates</option>
      <option value="A">Gate A</option>
      <option value="B">Gate B</option>
      <option value="C">Gate C</option>
      <option value="D">Gate D</option>
    </select>

    <!-- REFRESH BUTTON: app.js listens for its click event -->
    <button id="refresh-btn">↻ Refresh</button>

    <!-- Entry counter, updated by app.js after each fetch -->
    <div id="entry-count">Entries: <span id="count-value">—</span></div>
  </div>

  <!-- ── ENTRY TABLE ── -->
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <!-- Columns match the joined people + stadium_entries shape -->
          <th>#</th>
          <th>Name</th>
          <th>Gate</th>
          <th>Hour</th>
          <th>Bag</th>
        </tr>
      </thead>
      <!-- app.js injects rows here after fetching from /api/entries -->
      <tbody id="entries-body">
      </tbody>
    </table>

    <!-- Shown when no entries have loaded; hidden by app.js on success -->
    <div id="empty-state">
      Start the backend, then click Refresh to load entry records.
    </div>
  </div>

  <!-- app.js holds all the fetch and render logic -->
  <script src="app.js"></script>

</body>
</html>
